version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react-native*"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /functions
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
