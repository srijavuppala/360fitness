name: Security
# Runs as part of ci.yml on every push/PR, plus a weekly re-scan that catches
# advisories published after code merged.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan only the commits this push/PR adds; the weekly run scans all history.
      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "opts=--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "opts=--log-opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "opts=" >> "$GITHUB_OUTPUT"
          fi
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --exit-code 1 ${{ steps.range.outputs.opts }}

  dependencies:
    name: Dependency audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [apps/mobile, apps/web, functions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails on high/critical production advisories not in .github/audit-allowlist.json.
      - run: node scripts/audit-gate.mjs ${{ matrix.dir }} --level high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # dependency-review-action needs the repository's Dependency graph
      # (Settings > Code security > Dependency graph). Until the owner enables
      # it, say so loudly instead of failing with an opaque error; the npm
      # audit gate above still blocks high/critical advisories. Once enabled,
      # this check enforces automatically with no workflow change.
      - name: Check Dependency graph is enabled
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency review not running::Dependency graph is disabled for this repository (HTTP $code). Enable it: https://github.com/$REPO/settings/security_analysis . The npm audit gate still blocks high/critical advisories."
            echo "### ⚠️ Dependency review not running" >> "$GITHUB_STEP_SUMMARY"
            echo "Enable **Dependency graph** at https://github.com/$REPO/settings/security_analysis — then this check enforces automatically." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/dependency-review-action@v4
        if: steps.depgraph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
