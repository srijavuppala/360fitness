name: Website and Firebase
# Called by ci.yml (one pipeline for every branch and PR); not triggered directly.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Web imports mobile domain modules; Vite resolves their Expo tsconfig.
      - run: npm ci
        working-directory: apps/mobile
      - run: npm ci
        working-directory: apps/web
      - run: npm run check
        working-directory: apps/web
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run test:profiles
        working-directory: functions
  packages:
    name: Shared packages (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [workout-core, glucose-core, health-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free packages: Node runs the TypeScript directly, no install.
      - run: npm test
        working-directory: packages/${{ matrix.package }}
